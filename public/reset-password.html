<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - KnowledgeShare</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Universal Navigation Bar -->
  <header>
    <div class="navbar">
      <a href="index.html" class="nav-brand">KnowledgeShare</a>
      
      <nav class="nav-streams" id="navStreams">
        <div class="nav-streams-indicator" id="navStreamsIndicator"></div>
        <a href="index.html" class="stream-tab" data-stream="All">All</a>
        <a href="index.html?stream=Technology" class="stream-tab" data-stream="Technology">Technology</a>
        <a href="index.html?stream=Medical" class="stream-tab" data-stream="Medical">Medical</a>
        <a href="index.html?stream=Science" class="stream-tab" data-stream="Science">Science</a>
        <a href="index.html?stream=Entertainment" class="stream-tab" data-stream="Entertainment">Entertainment</a>
        <a href="index.html?stream=Trending" class="stream-tab" data-stream="Trending">Trending</a>
        <a href="index.html?stream=Business" class="stream-tab" data-stream="Business">Business</a>
      </nav>

      <div class="nav-links">
        <a href="create.html" class="nav-link" id="writeLink">Write</a>
        <div id="authArea"></div>
      </div>
    </div>
  </header>

  <!-- Reset Password Form Container -->
  <main class="auth-container">
    <div class="auth-form-panel active">
      <h2 class="auth-title serif" style="font-size: 24px; text-align: left; margin-bottom: 8px;">Create New Password</h2>
      <p class="text-muted" style="font-size: 13px; margin-bottom: 24px;">Please choose a strong password containing at least 6 characters.</p>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" id="newPassword" class="form-input" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-input" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px; border-radius: 8px;">Update Password</button>
      </form>
    </div>
  </main>

  <div id="toastNotification" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
